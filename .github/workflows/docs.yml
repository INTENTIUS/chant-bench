name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "results/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "results/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install mkdocs-material

      # Every published result set must satisfy the schema before it can be
      # rendered. A result whose gates failed is publishable — it renders as
      # invalid — but a result that is malformed is not, because the site would
      # show a number with no way to tell what produced it.
      - name: Validate result sets
        run: python3 scripts/validate_results.py

      # The results pages are generated, not written. Regenerating and diffing
      # catches a page hand-edited into disagreeing with its result set, and a
      # result committed without rebuilding — both of which put a number on the
      # site that no record backs.
      - name: Results pages are up to date
        run: |
          python3 scripts/build_pages.py
          if ! git diff --quiet -- docs/; then
            echo "::error::generated pages are stale — run 'just build' and commit"
            git diff --stat -- docs/
            exit 1
          fi

      # --strict fails on a broken internal link. The site's whole claim is that
      # every number links to the evidence behind it, so a dead link is a
      # correctness bug rather than a cosmetic one.
      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
