site_name: chant-bench
site_description: Benchmarks for agentic infrastructure — how much does the tool an agent is holding help it answer questions about the estate it built?
site_url: https://intentius.github.io/chant-bench/
repo_url: https://github.com/INTENTIUS/chant-bench
repo_name: intentius/chant-bench
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Deep teal reads as instrument rather than brand, and leaves the semantic
    # green/amber/red free to mean gate state and nothing else.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - styles/results.css

# Run pages are generated — one per result set, and there will be dozens. They
# are linked from each arm's page rather than listed here, and declared so
# `--strict` does not treat "not in nav" as an error.
not_in_nav: |
  /aws-bench/ec2-multiregion/*/runs/*.md

nav:
  - Overview: index.md
  - Method: method.md
  - Run it yourself: running.md
  - aws-bench:
      - What it is: aws-bench/index.md
      - ec2-multiregion:
          - The scenario: aws-bench/ec2-multiregion/index.md
          - Results: aws-bench/ec2-multiregion/results.md
          - chant: aws-bench/ec2-multiregion/chant/index.md
          - Terraform: aws-bench/ec2-multiregion/terraform/index.md
          - Pulumi: aws-bench/ec2-multiregion/pulumi/index.md
          - AWS CDK: aws-bench/ec2-multiregion/cdk/index.md
          - Alchemy: aws-bench/ec2-multiregion/alchemy/index.md
          - Alchemy v2 (Effect): aws-bench/ec2-multiregion/alchemy-effect/index.md
